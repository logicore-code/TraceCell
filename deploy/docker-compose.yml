# TraceCell 全离线部署：三个 MiniCPM 模型 + TraceCell 应用
#
# 默认这套配置按 24GB 显存的卡配：
#   - MiniCPM-OCR 1.0   1.3B   解析     BF16 权重 2.6GB + mmproj 0.9GB
#   - MiniCPM-OCR Jev   2B     评分     BF16 权重 4.2GB
#   - MiniCPM-V 4.7     1B     升级复核 BF16 权重 3.1GB
#
# 48GB 的卡可以把 V 4.7 换成 35B-A3B 的 AWQ 版（权重 22.7GB）：
#   VLM_MODEL=openbmb/MiniCPM-V-4.7-35B-A3B-AWQ VLM_GPU_FRACTION=0.62 \
#     docker compose -f deploy/docker-compose.yml up -d
#
# 35B-A3B 的 BF16 权重有 65.6GB，单卡放不下，要么量化，要么走官方那套把
# 专家权重分片按需读取的端侧方案。

services:
  minicpm-ocr:
    image: vllm/vllm-openai:latest
    container_name: tracecell-ocr
    command:
      - --model=openbmb/MiniCPM-OCR-1.0
      - --served-model-name=openbmb/MiniCPM-OCR-1.0
      - --port=8000
      - --trust-remote-code
      - --limit-mm-per-prompt.image=8
      - --gpu-memory-utilization=0.28
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  minicpm-ocr-jev:
    # 这个镜像由官方仓库构建，TraceCell 不重复造一遍：
    #   git clone https://github.com/OpenBMB/MiniCPM-OCR.git
    #   cd MiniCPM-OCR/scripts/minicpm-ocr-jev
    #   docker build -f serve/Dockerfile -t minicpm-ocr-jev:latest .
    # 权重目录需要挂到 /weights 下，见 docs/deployment.md
    container_name: tracecell-jev
    image: minicpm-ocr-jev:latest
    ports:
      - "8030:8030"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - jev-weights:/weights:ro
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  minicpm-v47:
    image: vllm/vllm-openai:latest
    container_name: tracecell-vlm
    command:
      - --model=${VLM_MODEL:-openbmb/MiniCPM-V-4.7-1B}
      - --served-model-name=${VLM_MODEL:-openbmb/MiniCPM-V-4.7-1B}
      - --port=8001
      - --trust-remote-code
      - --gpu-memory-utilization=${VLM_GPU_FRACTION:-0.25}
      - --max-model-len=32768
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tracecell:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.app
    container_name: tracecell
    ports:
      - "8080:8080"
    environment:
      - TRACECELL_PROVIDER=minicpm
      - TRACECELL_OCR_URL=http://minicpm-ocr:8000
      - TRACECELL_JEV_URL=http://minicpm-ocr-jev:8030
      - TRACECELL_VLM_URL=http://minicpm-v47:8001
      - TRACECELL_OCR_MODEL=openbmb/MiniCPM-OCR-1.0
    depends_on:
      minicpm-ocr:
        condition: service_healthy
      minicpm-ocr-jev:
        condition: service_healthy
      minicpm-v47:
        condition: service_healthy
    volumes:
      - ./samples:/app/samples:ro

volumes:
  hf-cache:
  jev-weights:
