name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 测试
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout source code
        uses: checkout

      - name: 装 Python 3.11
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: 跑测试
        run: pytest -q

      - name: 跑一遍完整链路
        run: |
          tracecell scenarios
          tracecell demo --session samples/sessions
          tracecell calibrate samples/labelled.json --target-accuracy 0.99
          tracecell baseline --session samples/sessions
          tracecell batch samples --session samples/sessions --jobs 4

      - name: 装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai

      - name: 检查样例数据自洽
        run: |
          # 生成到临时目录，不覆盖仓库里的
          python3 scripts/make_samples.py --out /tmp/tracecell-regen
          python3 scripts/make_samples_extra.py --out /tmp/tracecell-regen
          # 字节一致要同版本字体才成立，那是本地的事；CI 查语义一致和内部自洽
          python3 scripts/check_samples.py --regenerated /tmp/tracecell-regen

  lint:
    name: 代码风格
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout source code
        uses: checkout

      - name: 装依赖
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: 跑 ruff
        run: ruff check src tests scripts
